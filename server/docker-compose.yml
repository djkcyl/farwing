# Farwing Server: web console, API, builtin STUN/TURN relay and NAT discovery.
#
# 1. Build the image from the repository root (see README.md):
#      docker build -f server/Dockerfile -t farwing-server .
# 2. docker compose up -d
# 3. Open https://<host>:8443/setup with the setup code from
#      docker compose logs farwing-server | grep "setup code"
#
# Host networking: the relay port range is reachable without publishing it
# through Docker's proxy, and the server sees clients' real addresses.

services:
  farwing-server:
    image: farwing-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - farwing-data:/var/lib/farwing-server
    stop_grace_period: 20s

volumes:
  farwing-data:
