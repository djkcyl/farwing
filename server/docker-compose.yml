# Farwing Server + coturn (external TURN, TURN REST "use-auth-secret").
#
# 1. Build the image from the repository root (see README.md):
#      docker build -f server/Dockerfile -t farwing-server .
# 2. Create ./farwing-server.toml next to this file (README.md, "Docker"):
#      [turn] mode = "external", shared_secret = <same value as TURN_SECRET>,
#      urls = ["stun:<host>:3478", "turn:<host>:3478?transport=udp",
#              "turn:<host>:3478?transport=tcp"]
#      data_dir = "/var/lib/farwing-server", listen = "0.0.0.0:8443"
# 3. Create ./.env with
#      TURN_SECRET=<the shared_secret from farwing-server.toml>
#      TURN_EXTERNAL_IP=<public IPv4 of this host>
# 4. docker compose up -d
#
# coturn uses host networking so that its relay port range is reachable
# without publishing thousands of ports through Docker's proxy.

services:
  farwing-server:
    image: farwing-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
    volumes:
      - ./farwing-server.toml:/etc/farwing-server/farwing-server.toml:ro
      - farwing-data:/var/lib/farwing-server
    environment:
      RUST_LOG: info
    stop_grace_period: 20s
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=farwing
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=::1

volumes:
  farwing-data:
